#brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.cf{font:italic 400 18px/1 'EB Garamond',Garamond,Georgia,serif;color:#f3e9d7}
#brand span{font:600 9.5px var(--sans,system-ui,sans-serif);letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
#brand svg{flex:none}
#projTitle{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-weight:600;font-size:14px;min-width:220px}
#projTitle:hover,#projTitle:focus{border-color:var(--line2);outline:none;background:var(--panel2)}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4a5059;background:#23272c}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
.btn.pri:hover{background:#d4651a}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2);border-color:var(--line2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
#saveStat{font:11px var(--mono);color:var(--sub);display:flex;align-items:center;gap:6px}
#saveStat i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
#saveStat.ok i{background:var(--green)} #saveStat.busy i{background:var(--amber)} #saveStat.warn i{background:var(--red)}
.menuWrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px;min-width:240px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;max-height:calc(100vh - 62px);max-height:calc(100dvh - 62px);overflow-y:auto;overscroll-behavior:contain;max-width:calc(100vw - 12px)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;font-size:12px}
.menu button:hover{background:#2a2f36}
.menu small{display:block;color:var(--sub);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
/* left */
#left{grid-row:2;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.secHead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600}
#tree{flex:0 0 auto;max-height:42%;overflow:auto;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.scene{margin-bottom:4px}
.sRow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer}
.sRow:hover{background:var(--panel2)}
.sRow.cur{background:#22262b}
.sNum{font:600 11px var(--mono);color:#fff;background:var(--amber);border-radius:4px;padding:1px 5px;min-width:22px;text-align:center}
.sHead{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500}
.setup{margin:2px 0 4px 18px;border-left:1px solid var(--line2);padding-left:8px}
.suRow{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);padding:3px 4px;border-radius:5px;cursor:pointer}
.suRow:hover{color:var(--text)} .suRow.cur{color:var(--amber2)}
.shots{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 4px 4px}
.shotChip{font:500 11px var(--mono);padding:2px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.shotChip:hover{border-color:#555}
.shotChip.cur{background:var(--teal);color:#06211e;border-color:var(--teal)}
.addMini{font-size:11px;color:var(--sub);background:none;border:1px dashed var(--line2);border-radius:4px;padding:1px 6px}
.addMini:hover{color:var(--text);border-color:#555}
#libWrap{flex:1;display:flex;flex-direction:column;min-height:0}
#libSearch{margin:0 10px 6px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;outline:none}
#libSearch:focus{border-color:#555}
#libCats{display:flex;gap:4px;padding:0 10px 6px;flex-wrap:wrap}
.cat{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid var(--line2);background:none;color:var(--sub)}
.cat.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#lib{flex:1;overflow:auto;padding:0 6px 10px}
.libGroup{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:8px 6px 3px;font-weight:600}
.libItem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid transparent;border-radius:6px;padding:4px 6px;text-align:left}
.libItem:hover{background:var(--panel2);border-color:var(--line2)}
.libItem.on{border-color:var(--amber);background:#2e1c10}
.libItem svg{flex:none;width:30px;height:24px}
.libItem .nm{flex:1;font-size:12px;line-height:1.2}
.libItem .w{font:10.5px var(--mono);color:var(--sub)}
/* center */
#center{grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0}
#shotBar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);min-height:40px;overflow:hidden}
#crumb{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#crumb b{color:var(--text);font-weight:600}
#crumb .slug{font:600 12px var(--mono);color:var(--amber2)}
#shotTabs{display:flex;gap:4px;flex:none}
#tools{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--sub)}
.tool:hover{color:var(--text);background:var(--panel2)}
.tool.on{color:var(--text);background:#2a2f36;border-color:var(--line2)}
.tool kbd{font:10px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:0 3px}
.tsep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);padding:3px 6px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--amber)}
#stage{flex:1;position:relative;min-height:0;background:#1b1e22}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
#cv.pan{cursor:grab} #cv.panning{cursor:grabbing} #cv.place,#cv.draw{cursor:crosshair}
#hint{position:absolute;left:12px;bottom:10px;background:rgba(17,19,21,.88);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:11.5px;color:var(--sub);pointer-events:none;max-width:70%}
#hint:empty{display:none}
#zoomBox{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
#legendMini{position:absolute;right:10px;top:10px;background:rgba(17,19,21,.85);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font:11px var(--mono);color:var(--sub);pointer-events:none}
#legendMini b{color:var(--amber2);font-weight:600}
/* right */
#right{grid-row:2;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#rtabs{display:flex;border-bottom:1px solid var(--line)}
.rtab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 8px;font-size:12px;color:var(--sub);font-weight:500}
.rtab.on{color:var(--text);border-bottom-color:var(--amber)}
#panel{flex:1;overflow:auto;padding:12px 14px 30px}
.pTitle{font-size:14px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.pSub{color:var(--sub);font-size:11.5px;margin-bottom:12px}
.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.grp>h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600}
.f{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin-bottom:7px}
.f>label{font-size:11.5px;color:var(--sub)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f2 .f{grid-template-columns:1fr;gap:3px}
.in{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:5px 7px;font-size:12px;outline:none;min-width:0}
.in:focus{border-color:#59606a}
textarea.in{resize:vertical;min-height:54px;line-height:1.35}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=color]{width:100%;height:28px;padding:1px;background:var(--panel2);border:1px solid var(--line2);border-radius:5px}
.rangeRow{display:flex;align-items:center;gap:8px}.rangeRow span{font:11px var(--mono);color:var(--sub);width:38px;text-align:right}
.chk{display:flex;align-items:center;gap:7px;font-size:12px}
.chk input{accent-color:var(--amber)}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{font-family:var(--mono)}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px;border:1px solid rgba(255,255,255,.2)}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;font-weight:600;color:var(--sub);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 4px;border-bottom:1px solid var(--line2)}
table.t td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.hi{background:var(--amber)} .bar i.over{background:var(--red)}
.big{font:600 22px var(--mono);letter-spacing:-.01em}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.stat3>div{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:8px}
.stat3 small{display:block;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.note{background:#1f2328;border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:6px;padding:8px 10px;font-size:12px;color:#cfd4da;margin:8px 0}
.note.ok{border-left-color:var(--green)} .note.bad{border-left-color:var(--red)}
.empty{color:var(--sub);font-size:12px;padding:10px 0}
.gearCat{margin-top:12px}
.gearCat h5{margin:0 0 4px;font-size:11px;color:var(--amber2);letter-spacing:.06em;text-transform:uppercase}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.gl .q{font:600 12px var(--mono);color:var(--text);min-width:28px;text-align:right}
.gl .why{color:var(--dim);font-size:10.5px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 9px;font-size:11.5px;color:var(--sub)}
.seg button.on{background:#2a2f36;color:var(--text)}
#status{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:11px var(--mono);color:var(--dim)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
#modal.open{display:flex}
#modalBox{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:min(560px,92vw);max-height:84vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#modalBox h3{margin:0 0 10px;font:500 21px/1.2 'EB Garamond',Garamond,Georgia,serif}
.mFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.projRow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line2);border-radius:7px;margin-bottom:6px}
.projRow.cur{border-color:var(--amber)}
.projRow div{flex:1}
.projRow small{color:var(--sub);display:block;font-size:11px}
.keys{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12px}
.keys kbd{font:11px var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#2a2f36;border:1px solid var(--line2);padding:8px 14px;border-radius:7px;font-size:12px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2c3137;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:1100px){#app{grid-template-columns:230px 1fr 290px}}

body.narrow #left{left:0} body.narrow #right{right:0}
#top{gap:7px;padding:0 8px;min-width:0}
#top .ico{padding:5px 7px;font-size:14px;line-height:1}
.btn.on{border-color:var(--amber);color:var(--amber2)}
#projTitle{min-width:70px;flex:0 1 190px;width:190px}
#crumb{flex:1 1 0;min-width:0}
#shotTabs{flex:0 1 auto;min-width:0;max-width:32vw;overflow-x:auto;scrollbar-width:none;white-space:nowrap;align-items:center}
#shotTabs::-webkit-scrollbar{display:none}
#shotTabs>*{flex:none}
#tools{position:absolute;left:10px;top:10px;flex-direction:column;align-items:stretch;gap:2px;padding:4px;border:1px solid var(--line2);border-radius:10px;background:rgba(23,25,28,.95);z-index:5;flex-wrap:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tool{flex-direction:column;gap:2px;padding:5px 2px 4px;width:52px;font-size:9.5px;line-height:1.1;text-align:center;justify-content:center}

.tsepH{height:1px;background:var(--line2);margin:3px 5px}
#quick{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 160px);padding:6px 10px;background:rgba(23,25,28,.97);border:1px solid var(--line2);border-radius:10px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:12px}

.qf{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-size:11px;white-space:nowrap}
.qm{font:11px var(--mono);color:var(--sub);white-space:nowrap}
.qsep{width:1px;height:18px;background:var(--line2)}
#legendMini{top:auto;bottom:46px;right:10px}
#hint{left:50%;transform:translateX(-50%);bottom:52px;max-width:min(820px,94%);text-align:center;z-index:4}
#viewBar{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;max-width:calc(100% - 250px);background:rgba(23,25,28,.95);border:1px solid var(--line2);border-radius:8px;padding:2px 6px;z-index:4}
#zoomBox{align-items:center;z-index:4}
#sCoord{font:11px var(--mono);color:var(--dim);margin-right:6px;white-space:nowrap}
.rtab{font-size:11.5px;padding:10px 2px 8px}
#modalBox.wide{width:min(1180px,96vw)}
.xGrid{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.xOpts{max-height:64vh;overflow:auto;padding-right:6px}
.xSec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600;margin:14px 0 6px}
.xSec:first-child{margin-top:0}
.xOpts .chk{margin:4px 0}
.xOpts .seg{margin:0 0 6px;display:flex}

.slWrap{overflow:auto;max-height:62vh;border:1px solid var(--line2);border-radius:6px}

#scriptView{white-space:pre-wrap;word-break:break-word;font:12px/1.6 'Courier New',Courier,monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:10px;max-height:50vh;overflow:auto;user-select:text;-webkit-user-select:text;cursor:text;margin-top:8px}

.covRow{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}

.covRow i{width:10px;height:10px;border-radius:2px;flex:none}
.covRow span:last-child{margin-left:auto;color:var(--sub);font-size:11px}
@media (max-width:1250px){#crumb{display:none}#top .sp2{flex:1}#shotTabs{max-width:none;flex:1 1 0}}

.dayChip{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber2);white-space:nowrap;flex:none}
.xCred{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:8px}.xCred label{display:flex;flex-direction:column;gap:2px;color:var(--text)}

function kitUsage(items){
  const u={},miss={};const add=(k,n)=>u[k]=(u[k]||0)+(n==null?1:n);const no=(name,n)=>miss[name]=(miss[name]||0)+(n==null?1:n);
  let mains=0;const circ=new Set();let cableRuns=0,track=0;
  const stand=(m,src)=>{switch(m){case 'C-stand':add('cstand');add('sandbag');break;case 'Light stand (Arri kit)':add('lwStand');add('sandbag');break;case 'Beefy baby stand':add('beefy');add('sandbag');break;case 'Pigeon (floor)':add('pigeon');break;case 'Clamp / rig':add('clamps');break;
    case 'Combo stand':no('Combo stand');break;case 'Baby stand':no('Baby stand');break;case 'Rolling stand':no('Rolling stand');break;case 'Menace / boom arm':no('Menace arm');break;case 'Floor (turtle)':no('Turtle base');break;case 'Overhead / pipe':no('Pipe clamps / overhead rig');break;}};
  items.forEach(it=>{
    if(it.t==='line'){if(it.kind==='cable')cableRuns+=Math.ceil(lineLen(it.pts)/25);if(it.kind==='track')track+=lineLen(it.pts);return;}
    const L=LIB[it.t];if(!L)return;
    if(L.kind==='light'){if(L.group==='Natural')return;const k=KIT_LIGHT_MAP[it.t];if(k)add(k);else no(L.name);
      if((it.modifier==='Softbox'||it.modifier==='Softbox + grid')&&it.t!=='k_minimix'&&it.t!=='k_dash')add('chimBox');
      else if(['Lantern skirt','Dome / diffuser','Snoot','Spot / projection','Fresnel attachment'].includes(it.modifier)&&!/lantern/.test(it.t))no(it.modifier+' (modifier)');
      
      stand(it.mount);if(drawsPower(it)>0){mains++;circ.add(it.circuit||'?');}return;}
    if(L.kind==='grip'){
      if(it.t==='cstand'){add('cstand');add('sandbag');return;}if(it.t==='beefy'){add('beefy');add('sandbag');return;}if(it.t==='pigeon'){add('pigeon');return;}
      if(it.t==='applebox'){add('apple');return;}if(it.t==='sandbag'){add('sandbag');return;}
      if(it.t==='frame'){if(it.size==='4×4'){add('rrFrame');const f=it.fabric;if(/silk/i.test(f))add('rrSilk');else if(/single/i.test(f))add('rrSingle');else if(/solid/i.test(f))add('rrSolid');else if(/lam/i.test(f))add('rrLame');else no('4×4 '+f+' (rag not in kit)');}else no(it.size+' frame + '+it.fabric);
        if(it.standed){add('cstand');add('sandbag');}return;}
      if(it.t==='flag'||it.t==='negfill'){const t=it.ftype||'';if(it.size==='18×24'){if(/single/i.test(t))add('f18Single');else if(/double/i.test(t))add('f18Double');else if(/silk/i.test(t))add('f18Silk');else if(/solid/i.test(t))add('f18Flag');else no('18×24 '+t);}
        else if(it.size==='40×40 floppy'&&/solid/i.test(t))add('floppy40');else if(it.size==='4×4 floppy'&&/solid/i.test(t))add('rrSolid');else no(it.size+' '+t);
        if(it.standed){add('cstand');add('sandbag');}return;}
      if(it.t==='bounce'){if(/Flexfill/.test(it.size+it.fabric))add('flexfill');else no(it.size+' '+it.fabric+' (expendable / not in kit)');if(it.standed){add('cstand');add('sandbag');}return;}
      no(L.name);return;}
    if(L.kind==='camera'){const sp=it.support;if(sp==='Baby legs (100mm)')add('babyLegs');else if(sp==='Hi-hat')add('hihat');else if(sp==='Ladder + hi-hat'){add('hihat');no('Ladder (6′ A-frame stepladder)');}else if(sp==='Dolly'){}else if(sp==='Sticks (tripod)')no('Standard-height sticks (kit has baby legs + hi-hat only)');else if(!['Handheld','Shoulder'].includes(sp))no(sp);return;}
    if(L.kind==='camgear'){if(it.t==='village')add('monitor');else if(it.t==='dolly')add('dolly');else if(it.t==='boom'){}else no(L.name);return;}
    if(L.kind==='power'){if(it.t==='quadbox')add('quad');else if(it.t==='outlet'){}else no(L.name);return;}
  });
  if(mains){add('stinger',Math.max(cableRuns,circ.size));add('quad',Math.max(0,Math.ceil(mains/4)-(u.quad||0))>0?Math.ceil(mains/4)-(u.quad||0):0);}else if(cableRuns)add('stinger',cableRuns);
  if(track>12.01)no(`Dolly track beyond 12 ft (${Math.ceil(track)} ft drawn)`);
  add('fire');
  return {u,miss};
}

function activeItems(su,sh){su=su||setup();sh=sh||shot();return su.items.concat(sh.items);}
function findItem(id){const su=setup(),sh=shot();let i=su.items.findIndex(x=>x.id===id);if(i>=0)return {it:su.items[i],arr:su.items,i};i=sh.items.findIndex(x=>x.id===id);if(i>=0)return {it:sh.items[i],arr:sh.items,i};return null;}

/* undo */
function snap(){undoStack.push(JSON.stringify(P));if(undoStack.length>120)undoStack.shift();redoStack=[];updUndo();}

function fit(){measure();const b=bbox(activeItems(),3);const padL=74/CW,padT=54/CH;const z=Math.min(CW*(1-padL)/(b.x1-b.x0),CH*(1-2*padT)/(b.y1-b.y0));V.zoom=Math.max(4,Math.min(120,z));V.vx=(b.x0+b.x1)/2-(CW+74)/2/V.zoom;V.vy=(b.y0+b.y1)/2-CH/2/V.zoom;renderCanvas();}

function placeAt(w,keep,alt){
  const k=V.placing;snap();const L=libOf(k);
  const it=newItem(k,w.x,w.y,{});it.r=V.lastRot[k]!=null?V.lastRot[k]:(L.kind==='camera'?-90:0);if(L.wallSnap&&!alt&&snapToWall(it,{x:w.x,y:w.y}))toast(L.name+' set into wall');
  if(L.kind==='talent'){const n=activeItems().filter(i=>i.t==='actor').length;it.color=ACTOR_COLORS[n%ACTOR_COLORS.length];it.label='CHARACTER '+(n+1);}
  if(L.kind==='camera'){const n=shot().items.filter(i=>i.t==='camera').length;it.cam='ABCDE'[n]||'A';}
  if(k==='mark'){const n=activeItems().filter(i=>i.t==='mark').length;it.label=String(n+1);}
  (it.scope==='shot'?shot().items:setup().items).push(it);
  V.sel=it.id;V.multi=[];clearSnapFx();if(!keep){V.placing=null;V.ghostPos=null;setTool('select');}
  V.rightTab='item';changed();
}
function makeRoom(x,y,w,h){snap();const it=newLine('wall',[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}]);setup().items.push(it);V.sel=it.id;V.multi=[];V.rightTab='item';setTool('select');changed();toast(`Room ${fmtFt(w)} × ${fmtFt(h)} — drag a wall's white handle to resize`);}
function roomDialog(a){openModal(`<h3>Room size</h3><div class="pSub">Type the room's inside dimensions. Feet and inches both work: <b>12</b>, <b>12.5</b> or <b>12' 6"</b>.</div><div class="f2">${fld('Width (left to right)','<input class="in" id="rmW" value="14\'">')}${fld('Depth (top to bottom)','<input class="in" id="rmH" value="12\'">')}</div><div class="mFoot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="rmOK">Create room</button></div>`);
  const go=()=>{const w=parseFt($('#rmW').value),h=parseFt($('#rmH').value);if(!(w>=1)||!(h>=1)){toast('Enter a width and depth of at least 1 ft');return;}closeModal();makeRoom(a.x,a.y,r2(w),r2(h));setTimeout(fit,0);};
  $('#rmOK').onclick=go;$('#modalBox').onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>{const f=$('#rmW');if(f){f.focus();f.select();}},0);}
function draftSnap(w,e){const d=V.draft;const kind=d?d.kind:V.tool;const last=d&&d.pts.length?d.pts[d.pts.length-1]:null;const lockDef=kind==='wall'||kind==='track'||(typeof STREET_KINDS!=='undefined'&&STREET_KINDS.has(kind));const lock=!!last&&(lockDef?!e.shiftKey:e.shiftKey);
  return snapPt(w,{kinds:SNAPK[kind],segKinds:kind==='cammove'?['track']:kind==='wall'?['wall']:null,align:lockDef?['wall',kind]:null,from:last,lock,alt:e.altKey,extra:d?d.pts.slice(0,-1).map(p=>({x:p.x,y:p.y,k:kind})):null});}
function addDraftPt(w,e){let q=draftSnap(w,e);q={x:q.x,y:q.y};
  if(!V.draft){const kind=V.tool;let color=LINES[kind].color,label='',owner='';const nd0=Math.max(2.5,30/V.zoom);
    if(kind==='actor'){let near=null,nd=nd0;activeItems().filter(i=>i.t==='actor').forEach(a=>{const d=Math.hypot(a.x-w.x,a.y-w.y);if(d<nd){nd=d;near=a;}});if(near){color=near.color;label=near.label;owner=near.id;q={x:near.x,y:near.y};}}
    if(kind==='cammove'){label='DOLLY';let near=null,nd=nd0;shot().items.filter(i=>i.t==='camera').forEach(a=>{const d=Math.hypot(a.x-w.x,a.y-w.y);if(d<nd){nd=d;near=a;}});if(near){owner=near.id;q={x:near.x,y:near.y};}}
    V.draft={t:'line',kind,pts:[q],color,label,owner};V.typed='';renderQuick();}
  else{const d=V.draft;const last=d.pts[d.pts.length-1];if(Math.hypot(last.x-q.x,last.y-q.y)<.05){finishDraft();return;}d.pts.push(q);V.typed='';
    if(d.kind==='wall'&&d.pts.length>3&&Math.hypot(q.x-d.pts[0].x,q.y-d.pts[0].y)<.02){finishDraft();return;}}
  V.draft.cursor=q;renderCanvas();updHint();}
function applyTyped(){const d=V.draft;const len=parseFt(V.typed);V.typed='';if(!d||!(len>0)){updHint();return;}const last=d.pts[d.pts.length-1];let ux=1,uy=0;const c=d.cursor;
  if(c&&Math.hypot(c.x-last.x,c.y-last.y)>.01){const L=Math.hypot(c.x-last.x,c.y-last.y);ux=(c.x-last.x)/L;uy=(c.y-last.y)/L;}
  else if(d.pts.length>1){const p=d.pts[d.pts.length-2];const L=Math.hypot(last.x-p.x,last.y-p.y)||1;ux=(last.x-p.x)/L;uy=(last.y-p.y)/L;}
  const q={x:r2(last.x+ux*len),y:r2(last.y+uy*len)};d.pts.push(q);d.cursor=q;clearSnapFx();renderCanvas();updHint();}
function finishDraft(){const d=V.draft;V.draft=null;V.typed='';clearSnapFx();if(!d||d.pts.length<2){renderCanvas();updHint();return;}snap();const it=newLine(d.kind,d.pts);it.color=d.color;it.label=d.label;it.owner=d.owner||'';(it.scope==='shot'?shot().items:setup().items).push(it);V.sel=it.id;V.multi=[];V.rightTab='item';changed();updHint();}
function startMoveFrom(it){const kind=it.t==='camera'?'cammove':'actor';V.placing=null;setTool(kind);V.draft={t:'line',kind,pts:[{x:it.x,y:it.y}],color:kind==='actor'?it.color:LINES[kind].color,label:kind==='actor'?it.label:'DOLLY',owner:it.id};V.typed='';renderQuick();updHint();renderCanvas();}

}
function toolIcon(k){const c='currentColor';const m={select:`<path d="M3 2l9 5-4 1-1 4z" fill="${c}"/>`,pan:`<path d="M7 1v12M1 7h12M7 1l-2 2M7 1l2 2M7 13l-2-2M7 13l2-2M1 7l2-2M1 7l2 2M13 7l-2-2M13 7l-2 2" stroke="${c}" fill="none"/>`,room:`<rect x="2" y="3" width="10" height="8" stroke="${c}" stroke-width="2.2" fill="none"/>`,wall:`<path d="M1 11h12V3" stroke="${c}" stroke-width="2.4" fill="none"/>`,actor:`<circle cx="3" cy="10" r="2" fill="${c}"/><path d="M5 9l6-5M8 3h3v3" stroke="${c}" fill="none" stroke-width="1.4"/>`,cammove:`<rect x="1" y="7" width="5" height="4" fill="${c}"/><path d="M7 7l6-4M10 2.5h3V6" stroke="${c}" fill="none" stroke-dasharray="2 1.5" stroke-width="1.4"/>`,track:`<path d="M2 2v10M6 2v10M1 4h6M1 7h6M1 10h6" stroke="${c}" fill="none"/>`,cable:`<path d="M1 11c3-8 6 0 12-8" stroke="${c}" fill="none" stroke-dasharray="3 1.5" stroke-width="1.4"/>`};return `<svg width="14" height="14" viewBox="0 0 14 14">${m[k]||''}</svg>`;}
function setTool(k){V.tool=k;V.draft=null;V.typed='';V.roomDraft=null;clearSnapFx();if(k!=='select'&&k!=='pan'){V.placing=null;V.ghostPos=null;}cv.setAttribute('class',k==='pan'?'pan':(LINES[k]||k==='room')?'draw':V.placing?'place':'');renderTools();renderLib();updHint();renderQuick();renderCanvas();}
function updHint(){let h='';const Y=s=>`<b style="color:#ffcf7a">${s}</b>`;
  if(V.placing)h=`Placing ${Y(esc(libOf(V.placing).name))}${libOf(V.placing).wallSnap?' — snaps into the nearest wall (Alt = place freely)':''} — click to drop · Shift-click to drop several · Esc to cancel`;
  else if(V.tool==='room')h=`${Y('Room')} — drag out a rectangle; its size shows as you drag · or click once to type exact dimensions`;
  else if(LINES[V.tool]){const k=V.tool,d=V.draft;

    else if(k==='wall')h=d?`${Y('Wall')} — click the next corner · type a length + Enter for an exact wall · click the first corner to close the room · Enter to finish · Backspace removes the last corner`:`${Y('Wall')} — click to start. Walls stay straight (0°/45°/90°) on their own; hold Shift for any angle`;
    else if(typeof STREET_KINDS!=='undefined'&&STREET_KINDS.has(k))h=`${Y(LINES[k].name.replace(' (draw it)',''))} — ${d?'click the next point':'click to start'} · stays straight unless you hold Shift · type a length + Enter · Enter or double-click to finish · then drag the round handle on any stretch to curve it`;
    else if(k==='track')h=`${Y('Dolly track')} — click points; stays straight unless you hold Shift · type a length + Enter · Enter to finish`;
    else h=`${Y(LINES[k].name)} — ${d?'click each stop':(k==='actor'?'start on an actor (it attaches and follows them)':k==='cammove'?'start on a camera (it attaches and follows it)':'click to start')} · points snap to actors, marks, cameras and track · Enter or double-click to finish`;}
  else if(V.tool==='pan')h='Drag to pan · scroll to zoom';

/* quick bar: the few fields you change most, right above the plan */
let fromQuick=false;
function renderQuick(){const q=$('#quick');if(!q||fromQuick)return;const ids=P?selIds():[];
  if(!ids.length||V.placing||V.draft||V.tool==='room'){q.innerHTML='';return;}
  const tail=`<span class="qsep"></span><button class="btn sm" data-act="dup" title="Duplicate (⌘/Ctrl D)">Duplicate</button><button class="btn sm danger" data-act="del" title="Delete">Delete</button>`;
  if(ids.length>1){q.innerHTML=`<b>${ids.length} items selected</b><span class="qm">drag to move together</span>${tail}`;return;}
  const it=selItem();if(!it){q.innerHTML='';return;}const isLine=it.t==='line';const L=LIB[it.t];if(!isLine&&!L){q.innerHTML='';return;}
  const num=(lab,k,val,attrs)=>`<label class="qf">${lab}<input class="in" data-k="${k}" type="number" value="${esc(val)}" ${attrs||''}></label>`;
  const ft=(lab,attr,val)=>`<label class="qf">${lab}<input class="in" ${attr} value="${esc(fmtFtIn(val))}"></label>`;
  let h=`<b>${esc(isLine?(it.kind==='wall'&&rectOf(it)?'Room':LINES[it.kind].name):L.name.replace(/ \(.*\)/,''))}</b>`;
  if(isLine){const len=lineLen(it.pts);
    if(it.kind==='wall'){const rc=rectOf(it);if(rc)h+=ft('W','data-room="w"',rc.w)+ft('D','data-room="h"',rc.h);else if(it.pts.length===2)h+=ft('Length','data-seg="1"',len);else h+=`<span class="qm">${fmtFt(len)} of wall</span>`;
      if(!isStraight(it))h+=`<button class="btn sm" data-act="straighten" title="Square every wall to the nearest 45°">Straighten</button>`;}
    else{h+=`<span class="qm">${fmtFt(len)}</span>`;if(it.kind==='actor'||it.kind==='cammove'){const ow=it.owner?(findItem(it.owner)||{}).it:null;h+=ow?`<span class="qm" style="color:var(--green)">follows ${esc(ow.t==='camera'?(ow.cam||'A')+' cam':(ow.label||'actor'))}</span>`:`<button class="btn sm" data-act="attach">Attach to ${it.kind==='actor'?'actor':'camera'}</button>`;}}}
  else if(L.kind==='set'){if(L.wallSnap)h+=num('W','w',it.w,'min="1" step=".25"');else if(L.shape!=='north')h+=num('W','w',it.w,'min=".25" step=".25"')+num('D','h',it.h,'min=".25" step=".25"');}
  else if(L.kind==='light')h+=`<label class="chk"><input type="checkbox" data-k="on" ${it.on!==false?'checked':''}>On</label><label class="qf">Level<input type="range" data-k="intensity" min="0" max="100" value="${it.intensity}"><span>${it.intensity}%</span></label>`;
  else if(L.kind==='talent')h+=`<label class="qf">Name<input class="in" data-k="label" value="${esc(it.label)}" style="width:110px"></label><button class="btn sm" data-act="drawmove" title="Draw this character's path; it stays attached to them">Draw move</button>`;
  else if(L.kind==='camera')h+=`<span class="qm">${esc(it.cam||'A')} · ${esc(lensLabel(it))}</span><button class="btn sm" data-act="drawmove" title="Draw this camera's move; it stays attached to the camera">Draw move</button>`;
  if(!isLine)h+=num('Angle','r',Math.round(it.r||0),'step="15" style="width:58px"');
  q.innerHTML=h+tail+`<button class="btn sm" data-act="more" title="Open every setting for this item">More…</button>`;}

function libIcon(key){

  if(LINES[key]){const it={t:'line',kind:key,pts:[{x:-1.3,y:.6},{x:1.3,y:-.6}],color:LINES[key].color};const L1={floor:'',set:'',beams:'',lines:'',grip:'',lights:'',cam:'',talent:'',labels:''};drawLine(it,L1,{C,px:.08,ghost:false,icon:true},false);inner=((L1.gz?L1.gz.map(x=>x[1]).join(''):'')+L1.floor+L1.set+L1.lines).replace(/data-id="[^"]*"/g,'');return `<svg viewBox="-1.6 -1.2 3.2 2.4">${inner}</svg>`;}

  let vb='-1.6 -1.2 3.2 2.4';if(['menace','jib','boom'].includes(key))vb='-2 -1.5 11 6';if(key==='s360'||key==='kino4'||key==='tube4')vb='-2.2 -2.4 4.4 4.8';if(key==='car')vb='-2 -1.5 4 3';

function nextShotNum(sc){const used=new Set();sc.setups.forEach(su=>su.shots.forEach(s=>used.add(s.num)));for(let i=0;i<26;i++){const n=sc.num+String.fromCharCode(65+i);if(!used.has(n))return n;}return sc.num+'-'+(used.size+1);}
function treeClick(e){
  const t=e.target;
  const sR=t.closest('[data-scene]');if(sR){V.sceneId=sR.dataset.scene;V.setupId=null;V.shotId=null;fixView();V.sel=null;changed(true,true);setTimeout(fit,0);return;}
  const suR=t.closest('[data-setup]');if(suR){V.setupId=suR.dataset.setup;V.shotId=null;fixView();V.sel=null;changed(true,true);return;}
  const shR=t.closest('[data-shot]');if(shR){V.setupId=shR.dataset.su;V.shotId=shR.dataset.shot;fixView();if(V.sel&&!findItem(V.sel))V.sel=null;changed(true,true);return;}
  const aS=t.closest('[data-addshot]');if(aS){snap();const su=scene().setups.find(s=>s.id===aS.dataset.addshot);const base=(su.id===setup().id?shot():su.shots[su.shots.length-1]);const n=mkShot(nextShotNum(scene()));n.size=base.size;n.items=reId(clone(base.items));su.shots.push(n);V.setupId=su.id;V.shotId=n.id;V.sel=null;V.rightTab='shot';changed();toast(`Shot ${n.num} added — characters and camera copied from ${base.num}. Changes here won't touch ${base.num}.`);return;}
  const aU=t.closest('[data-addsetup]');if(aU){snap();const sc=scene();const cur=setup();const letter=String.fromCharCode(65+sc.setups.length);const su=mkSetup('Setup '+letter);
    su.items=clone(cur.items.filter(i=>(i.t==='line'&&i.kind==='wall')||(LIB[i.t]&&['set','talent','text','power'].includes(LIB[i.t].kind))));reId(su.items);
    {const n0=mkShot(nextShotNum(sc));n0.items=reId(clone(blockingOf(shot().items)));su.shots.push(n0);}sc.setups.push(su);V.setupId=su.id;V.shotId=su.shots[0].id;V.sel=null;V.rightTab='shot';changed();toast(`${su.name} added — set, characters & power copied; lights cleared`);return;}
}
$('#tree').addEventListener('click',treeClick);$('#shotTabs').addEventListener('click',treeClick);
$('#addScene').addEventListener('click',()=>{snap();const n=P.scenes.reduce((m,s)=>Math.max(m,parseInt(s.num)||0),0)+1;const sc=mkScene(n);P.scenes.push(sc);V.sceneId=sc.id;V.setupId=null;V.shotId=null;fixView();V.sel=null;V.rightTab='shot';changed();setTimeout(fit,0);});

function powerFor(items){
  const loads=items.filter(i=>drawsPower(i)>0);const total=loads.reduce((s,i)=>s+drawsPower(i),0);
  const byC={};loads.forEach(i=>{const c=i.circuit||'(unassigned)';(byC[c]=byC[c]||{w:0,items:[]});byC[c].w+=drawsPower(i);byC[c].items.push(i);});
  const gens=items.filter(i=>i.t==='gen');const genCap=gens.reduce((s,g)=>s+(+g.capacity||0),0);
  const outlets={};items.filter(i=>i.t==='outlet').forEach(o=>outlets[o.circuit]=+o.amps||20);
  return {loads,total,byC,gens,genCap,outlets};}
function panelPower(){
  const S=P.settings;const pw=powerFor(activeItems());const cont=S.volts*S.breaker*.8;const amps=pw.total/S.volts;
  const need=pw.total?Math.ceil(pw.total/cont):0;const nums=lightNumbers(activeItems());

  else if(need<=1)rec=`This fits on <b>one ${S.breaker}A household circuit</b> (about ${fmtW(cont)} continuous at 80% of the breaker).`;
  else if(need<=3){cls='';rec=`You need <b>${need} separate ${S.breaker}A circuits</b>. On the scout, map which outlets share a breaker, because outlets in one room are often on the same circuit. Click <b>Auto-assign</b> below to spread the fixtures out.`;}
  else if(pw.total<=9000){cls='';rec=`At <b>${fmtW(pw.total)}</b> you need ${need} house circuits. That's a lot to find in most homes, so think about a <b>putt-putt generator</b> (a 7,000W-class inverter gives about 5,500W running), splitting the load between generator and house, or LED swaps.`;}
  else{cls='bad';rec=`<b>${fmtW(pw.total)}</b> is beyond house power and small generators. Plan a <b>tow plant</b> or a tie-in done by a licensed electrician, and talk to your gaffer and the school's equipment/safety office.`;}
  const circRows=Object.entries(pw.byC).sort().map(([c,v])=>{const lim=(pw.outlets[c]||S.breaker)*S.volts*.8;const pct=v.w/lim*100;const un=c==='(unassigned)';
    return `<tr><td><b>${esc(c)}</b><div class="bar"><i class="${pct>100?'over':pct>80?'hi':''}" style="width:${Math.min(100,pct)}%"></i></div></td><td class="n">${fmtW(v.w)}</td><td class="n">${(v.w/S.volts).toFixed(1)}A</td><td class="n" style="color:${un?'var(--sub)':pct>100?'var(--red)':pct>80?'var(--amber)':'var(--green)'}">${un?'—':Math.round(pct)+'%'}</td></tr>`;}).join('');
  // scene peak
  const sc=scene();let peak={w:0,num:''};sc.setups.forEach(su=>su.shots.forEach(sh=>{const w=powerFor(activeItems(su,sh)).total;if(w>peak.w)peak={w,num:sh.num};}));
  return `<div class="pTitle">Power — Shot ${esc(shot().num)}</div><div class="pSub">Counts every powered fixture that is switched on in this shot, at its full rated draw (the worst case).</div>
  <div class="stat3"><div><small>Total draw</small><div class="big">${fmtW(pw.total)}</div></div><div><small>Amps @${S.volts}V</small><div class="big">${amps.toFixed(1)}</div></div><div><small>${S.breaker}A circuits</small><div class="big">${need}</div></div></div>
  <div class="note ${cls}">${rec}</div>
  <div class="f2">${fld('Voltage',`<select class="in" data-o="settings" data-k="volts">${[120,230,240].map(v=>`<option ${v==S.volts?'selected':''}>${v}</option>`).join('')}</select>`)}${fld('House breaker',`<select class="in" data-o="settings" data-k="breaker">${[15,20].map(v=>`<option ${v==S.breaker?'selected':''} value="${v}">${v}A</option>`).join('')}</select>`)}</div>
  <div class="grp"><h4>By circuit</h4>${circRows?`<table class="t"><tr><th>Circuit</th><th style="text-align:right">Load</th><th style="text-align:right">Amps</th><th style="text-align:right">Used</th></tr>${circRows}</table>`:'<div class="empty">No loads.</div>'}
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" data-act="autocirc">Auto-assign circuits</button><button class="btn sm" data-act="clearcirc">Clear assignments</button></div>

  <div class="pSub" style="margin-top:8px">Rules of thumb: amps = watts ÷ volts. Load a breaker to no more than 80% for continuous use. LED and HMI figures are the fixture's rated draw; real draw at lower dimmer levels is less. Your gaffer has the final say on distribution.</div></div>`;
}
function autoCircuits(){const S=P.settings;const cont=S.volts*S.breaker*.8;const loads=activeItems().filter(i=>drawsPower(i)>0&&i.t!=='gen').sort((a,b)=>drawsPower(b)-drawsPower(a));
  if(!loads.length)return;snap();const bins=[];loads.forEach(l=>{const w=drawsPower(l);let b=bins.find(b=>b.w+w<=cont);if(!b){b={w:0,name:'C'+(bins.length+1)};bins.push(b);}b.w+=w;l.circuit=b.name;});changed();toast(`Spread across ${bins.length} circuit${bins.length>1?'s':''}`);}

function gearForItems(items,map,shotKey){
  const add=(cat,name,q,why)=>{const k=cat+'|'+name;if(map[k]&&map[k].why!==(why||''))map[k].why='';map[k]=map[k]||{cat,name,q:0,why:why||''};map[k].cur=(map[k].cur||0)+q;};
  items.forEach(it=>{
    if(it.t==='line'){const l=lineLen(it.pts);if(it.kind==='cable')add('Power & distro','Stinger 25′ (12/3)',Math.ceil(l/25),'from drawn cable runs');if(it.kind==='track')add('Camera support','Dolly track — 8′ straight',Math.ceil(l/8),'from drawn track');return;}

      if(it.gel&&it.gel!=='None')add('Electric — gels & diffusion',it.gel==='Color gel (custom)'?'Color gel (custom)':it.gel+' gel',1);

      if(st){add('Grip — stands (for fixtures)',st[0],1,'from fixture mounts');if(st[1])add('Grip — stands (for fixtures)','Sandbag',st[1],'est.');}
      if(drawsPower(it)>0)add('Power & distro','Stinger 25′ per fixture',1,'est. 1 per powered fixture');else if(it.power==='Battery')add('Electric — batteries','Charged batteries for '+L.name.replace(/ \(.*\)/,''),1,'battery-powered');

      if(it.t==='bounce'){add('Grip',`${it.size} ${it.fabric}`,1);if(it.standed){add('Grip — stands (for grip)','C-Stand',1);add('Grip — stands (for grip)','Sandbag',1,'est.');}return;}

    sc.setups.push(n);n.shots.forEach(s=>{s.num=nextShotNum(sc);});V.setupId=n.id;V.shotId=n.shots[0].id;changed();toast('Setup duplicated');}
  else if(act==='delshot')confirmBox(`Delete shot ${shot().num}?`,'Its cameras, moves and any items set to "This shot only" go with it. You can undo this.',()=>{const su=setup();if(su.shots.length===1){toast('A setup needs at least one shot. Delete the setup instead.');return;}snap();su.shots=su.shots.filter(s=>s.id!==shot().id);V.shotId=null;fixView();V.sel=null;changed();});
  else if(act==='delsetup')confirmBox(`Delete ${setup().name}?`,'Its lights, grip, set pieces and all of its shots go with it. You can undo this.',()=>{const sc=scene();if(sc.setups.length===1){toast('A scene needs at least one setup.');return;}snap();sc.setups=sc.setups.filter(s=>s.id!==setup().id);V.setupId=null;V.shotId=null;fixView();V.sel=null;changed();});
  else if(act==='delscene')confirmBox(`Delete Scene ${scene().num}?`,'Every setup and shot in it goes too. You can undo this.',()=>{if(P.scenes.length===1){toast('A project needs at least one scene.');return;}snap();P.scenes=P.scenes.filter(s=>s.id!==scene().id);V.sceneId=null;V.setupId=null;V.shotId=null;fixView();V.sel=null;changed();setTimeout(fit,0);});
}

function delSel(){const ids=selIds();if(!ids.length)return;snap();ids.forEach(id=>{const f=findItem(id);if(f)f.arr.splice(f.i,1);});V.sel=null;V.multi=[];changed();}
function dupSel(){const ids=selIds();if(!ids.length)return;snap();const copies=[];ids.forEach(id=>{const f=findItem(id);if(!f)return;const n=clone(f.it);if(n.t==='line')n.pts=n.pts.map(q=>({...q,x:q.x+1,y:q.y+1}));else{n.x+=1;n.y+=1;}f.arr.push(n);copies.push(n);});reId(copies);copies.forEach(n=>{if(n.owner&&!copies.some(c=>c.id===n.owner))n.owner='';});V.sel=copies.length?copies[copies.length-1].id:null;V.multi=copies.length>1?copies.map(c=>c.id):[];changed();}

function nudgeSel(dx,dy){const ids=selIds();if(!ids.length)return;snap();const all=activeItems();const set=new Set(ids);
  ids.forEach(id=>{const it=findItem(id).it;if(it.t==='line'&&it.owner&&findItem(it.owner))set.add(it.owner);});
  const walls=[];set.forEach(id=>{const f=findItem(id);if(!f)return;const it=f.it;if(it.t==='line'){if(it.kind==='wall')walls.push(it);}});
  const caps=capOpenings(walls).filter(c=>!set.has(c.id));
  set.forEach(id=>{const f=findItem(id);if(!f)return;const it=f.it;if(it.t==='line'){it.pts.forEach(q=>{q.x=r2(q.x+dx);q.y=r2(q.y+dy);});}else{it.x=r2(it.x+dx);it.y=r2(it.y+dy);}});
  all.forEach(l=>{if(l.t==='line'&&l.owner&&set.has(l.owner)){const ow=findItem(l.owner);if(ow&&l.pts.length)l.pts[0]={x:ow.it.x,y:ow.it.y};}});
  reseatOpenings(caps);changed();}
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const mod=e.metaKey||e.ctrlKey;const key=e.key.length===1?e.key.toLowerCase():e.key;
  if(mod&&key==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'&&!typing){e.preventDefault();redo();return;}
  if(typing){if(e.key==='Escape')document.activeElement.blur();return;}
  if($('#modal').classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  if(mod&&key==='d'){e.preventDefault();dupSel();return;}
  if(mod&&key==='a'){e.preventDefault();const ids=activeItems().map(i=>i.id);V.sel=ids.length?ids[ids.length-1]:null;V.multi=ids.length>1?ids:[];renderPanel();renderCanvas();return;}
  if(mod)return;
  if(V.draft){
    if(/^[0-9.'"]$/.test(e.key)||(e.key===' '&&V.typed)){V.typed+=e.key;e.preventDefault();updHint();return;}
    if(e.key==='Backspace'){e.preventDefault();if(V.typed){V.typed=V.typed.slice(0,-1);updHint();}else if(V.draft.pts.length>1){V.draft.pts.pop();renderCanvas();}return;}
    if(e.key==='Enter'){e.preventDefault();if(V.typed.trim())applyTyped();else finishDraft();return;}
  }
  if(e.key===' '){spaceDown=true;cv.classList.add('pan');e.preventDefault();return;}
  if(e.key==='Escape'){V.placing=null;V.ghostPos=null;V.multi=[];$('#exportMenu').classList.remove('open');setTool('select');return;}
  if((e.key==='Delete'||e.key==='Backspace')&&V.sel){e.preventDefault();delSel();return;}
  const it=selItem();
  if(it&&e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?1:.25;nudgeSel(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0);return;}
  if(it&&key==='r'&&it.t!=='line'){snap();it.r=((it.r||0)+(e.shiftKey?-15:15)+540)%360-180;V.lastRot[it.t]=it.r;changed();return;}
  if(it&&key==='o'&&LIB[it.t]&&LIB[it.t].kind==='light'){snap();it.on=it.on===false;changed();return;}
  const map={v:'select',h:'pan',b:'room',w:'wall',m:'actor',c:'cammove',t:'track',e:'cable'};
  if(map[key]){V.placing=null;setTool(map[key]);return;}
  if(key==='d'){V.dims=!V.dims;saveUI();renderTools();renderCanvas();return;}
  if(e.key==='['){$('#bLeft').click();return;}
  if(e.key===']'){$('#bRight').click();return;}
  if(e.key==='\\'){const any=UI.L||UI.R;UI.L=!any&&!UI.narrow;UI.R=false;if(!any&&UI.narrow)UI.L=true;applyUI();return;}
  if(key==='f'){fit();return;}
  if(e.key==='='||e.key==='+'){setZoom(V.zoom*1.2);return;}
  if(e.key==='-'){setZoom(V.zoom/1.2);return;}
});

function changed(rebuildPanel=true,noSave){renderTree();if(typeof renderExBar==='function')renderExBar();renderCanvas();if(rebuildPanel)renderPanel();updUndo();if(!noSave)scheduleSave();}
let DB=null,UID=null,cloudOK=false,saveTimer=null,saving=false,dirty=false,downloadsNS=null;
function setStat(cls,txt){const s=$('#saveStat');s.className=cls;s.querySelector('span').textContent=txt;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function scheduleSave(){dirty=true;P.updated=Date.now();setStat('busy','Unsaved changes…');clearTimeout(saveTimer);saveTimer=setTimeout(doSave,1200);}
async function doSave(){
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,800);return;}
  saving=true;dirty=false;const json=JSON.stringify(P);
  const all=lsGet('lplot.projects')||{};all[projId]={title:P.title,updated:P.updated,json};const localOK=lsSet('lplot.projects',all);lsSet('lplot.last',projId);
  if(DB&&UID){try{if(json.length>240000)throw {code:'too_big'};await DB.collection('data/users/'+UID).doc(projId).set({title:P.title,updated:P.updated,json});cloudOK=true;setStat('ok','Saved to your account');}
    catch(err){const c=err&&err.code;setStat('warn',c==='too_big'?'Project too large for cloud save, so export a JSON backup':c==='quota_exceeded'?'Cloud storage full, so export a JSON backup':localOK?'Saved in this browser only':'Not saved, so export a JSON backup');if(c==='unavailable'){dirty=true;setTimeout(doSave,4000);}}}
  else setStat(localOK?'ok':'warn',localOK?'Saved in this browser':'Not saved, so export a JSON backup');
  saving=false;if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,800);}
}
async function listProjects(){const out={};const loc=lsGet('lplot.projects')||{};Object.entries(loc).forEach(([id,v])=>out[id]={id,title:v.title,updated:v.updated,json:v.json,where:'browser'});
  if(DB&&UID){try{const snapq=await Promise.race([DB.collection('data/users/'+UID).get(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);snapq.docs.forEach(d=>{const v=d.data();if(!out[d.id]||(v.updated||0)>=(out[d.id].updated||0))out[d.id]={id:d.id,title:v.title,updated:v.updated,json:v.json,where:'account'};});}catch(e){}}
  return Object.values(out).sort((a,b)=>(b.updated||0)-(a.updated||0));}
function loadProject(id,json){try{P=normalize(JSON.parse(json));}catch(e){toast('Could not read that project');return;}projId=id;V.sceneId=V.setupId=V.shotId=null;V.sel=null;fixView();undoStack=[];redoStack=[];lsSet('lplot.last',id);changed(true,true);setTimeout(fit,30);setStat(DB?'ok':'ok',DB?'Saved to your account':'Saved in this browser');}
function newProject(demo){P=demo?demoProject():normalize({v:1,title:'Untitled Production',scenes:[mkScene(1)]});projId='p'+rid();V.sceneId=V.setupId=V.shotId=null;V.sel=null;fixView();undoStack=[];redoStack=[];changed();setTimeout(fit,30);}
async function boot(){
  // local first, instantly
  const last=lsGet('lplot.last');const loc=lsGet('lplot.projects')||{};
  if(last&&loc[last])loadProject(last,loc[last].json);else newProject(true);
  if(!(window.claude&&window.claude.use)){setStat('ok',Object.keys(loc).length?'Saved in this browser':'Saved in this browser');return;}
  try{
    const [u,d,dl]=await Promise.all([window.claude.use('user'),window.claude.use('db'),window.claude.use('downloads')]);
    downloadsNS=dl||null;
    if(u&&d){const id=await u.id();if(id){DB=d;UID=id;setStat('busy','Syncing…');const list=await listProjects();
      const pick=list.find(p=>p.id===projId)||list[0];
      if(pick&&pick.json&&(pick.id!==projId||(pick.updated||0)>(P.updated||0))){loadProject(pick.id,pick.json);}
      else if(!undoStack.length){doSave();}
      setStat('ok','Saved to your account');}}
  }catch(e){setStat('ok','Saved in this browser');}
}

const SHOTCOL=['#f2a93b','#4fd1c5','#b48cff','#ff7a7a','#7bd88f','#5cb8ff','#ffd166','#f08c3c'];
const STATUSES=['To plan','Diagrammed','Ready','Shot'];
function shStatus(sh){return sh.status||(sh.items.some(i=>i.t==='camera')?'Diagrammed':'To plan');}
function sceneShots(sc){const a=[];sc.setups.forEach(su=>su.shots.forEach(sh=>a.push({su,sh})));return a;}
function allShots(){const a=[];P.scenes.forEach(sc=>sc.setups.forEach(su=>su.shots.forEach(sh=>a.push({sc,su,sh}))));return a;}
function optList(list,val){return (val&&!list.includes(val)?[val]:[]).concat(list).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('');}
function fixCover(sc){const txt=sc.script||'';sceneShots(sc).forEach(({sh})=>{if(!sh.cover||!sh.cover.length)return;sh.cover=sh.cover.filter(c=>{if(txt.slice(c.s,c.e)===c.t)return true;const i=txt.indexOf(c.t);if(i>=0){c.s=i;c.e=i+c.t.length;return true;}return false;});});}
function coverText(sh){return (sh.cover||[]).slice().sort((a,b)=>a.s-b.s).map(c=>c.t.trim()).join('\n…\n');}
function gotoShot(id){for(const sc of P.scenes)for(const su of sc.setups)for(const sh of su.shots)if(sh.id===id){const ch=scene().id!==sc.id;V.sceneId=sc.id;V.setupId=su.id;V.shotId=sh.id;V.sel=null;V.multi=[];changed(true,true);if(ch)setTimeout(fit,0);return true;}return false;}
function panelScript(){
  const sc=scene(),sh=shot();const txt=sc.script||'';
  let h=`<div class="pTitle"><span class="sNum">${esc(sc.num)}</span> Script / sides</div><div class="pSub">${esc(sceneHeading(sc))}</div>`;
  if(!txt||V.scriptEdit){return h+`<textarea class="in" data-o="scene" data-k="script" style="min-height:320px;font:12px/1.5 'Courier New',Courier,monospace" placeholder="Paste this scene's script pages (your sides) here.">${esc(txt)}</textarea>
    <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm pri" data-act="scriptdone">Done</button></div>
    <div class="pSub" style="margin-top:8px">Paste the scene's text, then press <b>Done</b>. After that you can highlight lines and link them to a shot, so each diagram shows which part of the scene it covers.</div>`;}
  fixCover(sc);const shots=sceneShots(sc);const marks=[];shots.forEach(({sh:s},i)=>(s.cover||[]).forEach(c=>marks.push({s:c.s,e:c.e,i,num:s.num,id:s.id})));
  const cuts=[...new Set([0,txt.length].concat(...marks.map(m=>[m.s,m.e])))].sort((a,b)=>a-b);let body='';
  for(let k=0;k<cuts.length-1;k++){const a=cuts[k],b=cuts[k+1];const seg=esc(txt.slice(a,b));const ms=marks.filter(m=>m.s<=a&&m.e>=b);if(!ms.length){body+=seg;continue;}
    const cur=ms.find(m=>m.id===sh.id);const m0=cur||ms[0];const starts=ms.filter(m=>m.s===a).map(m=>m.num).join(' ');
    body+=`<mark data-shot="${m0.id}" class="${cur?'cur':''}" style="--c:${SHOTCOL[m0.i%SHOTCOL.length]}" ${starts?`data-tag="${esc(starts)}"`:''} title="Shot ${esc(ms.map(m=>m.num).join(', '))}">${seg}</mark>`;}

// a light dropped on a rail, grid or pole clips onto it and moves with it
function rigLocal(r,x,y){const a=-(r.r||0)*D2R;const dx=x-r.x,dy=y-r.y;return {u:dx*Math.cos(a)-dy*Math.sin(a),v:dx*Math.sin(a)+dy*Math.cos(a)};}

async function runExport(){const X=xo();
  if(X.format==='pdf'){const rows=exportRows(X);if(!rows.length){toast('No shots chosen');return;}
    try{const {blob,plan}=await makeExportPDF(X,(i,n)=>toast(`Building page ${i} of ${n}…`));const tag=X.scope==='shot'?`_sc${slug(scene().num)}_shot-${slug(shot().num)}`:X.scope==='project'?'_all-shots':X.scope==='day'?'_'+slug((dayById(X.dayId)||{}).name||'day'):X.scope==='pick'?'_selected-shots':X.scope==='setup'?`_sc${slug(scene().num)}_${slug(setup().name)}`:`_sc${slug(scene().num)}`;
      if(await saveOut(`${slug(P.title)}${tag}.pdf`,blob))toast(`PDF ready · ${plan.pages.length} page${plan.pages.length===1?'':'s'}`);else toast('Export cancelled');}catch(e){console.error(e);toast('PDF export failed');}return;}
  if(X.scope==='shot'){await exportOne(scene(),setup(),shot(),X);return;}
  const rows=exportRows(X);let n=0;for(const r of rows){if(await exportOne(r.sc,r.su,r.sh,X))n++;else{toast(n?`Stopped after ${n} sheet${n>1?'s':''}`:'Export cancelled');return;}}toast(`${n} sheet${n===1?'':'s'} exported`);}
function pickList(X){const pk=new Set(X.pick||scene().setups.flatMap(su=>su.shots.map(s=>s.id)));
  return `<div class="pickList">${P.scenes.map(sc=>{const ids=sc.setups.flatMap(su=>su.shots.map(s=>s.id));return `<label class="chk pkSc"><input type="checkbox" data-pk="${ids.join(',')}" ${ids.length&&ids.every(i=>pk.has(i))?'checked':''}> <b>Scene ${esc(sc.num)}</b> <span class="pSub">${esc(sceneHeading(sc))}</span></label>`+sc.setups.map(su=>`<div class="pkSu">${esc(su.name)}</div><div class="pkShots">${su.shots.map(sh=>`<label class="chk"><input type="checkbox" data-pk="${sh.id}" ${pk.has(sh.id)?'checked':''}> ${esc(sh.num)}</label>`).join('')}</div>`).join('');}).join('')}</div>`;}
function openExport(){
  const INFO=[['header','Title bar (production, scene, shot #)'],['f_scene','Scene description'],['f_size','Shot size & angle'],['f_move','Movement'],['f_cam','Camera, lens & support'],['f_cast','Cast'],['f_desc','Shot description'],['f_blocking','Blocking notes'],['f_intent','Lighting intent'],['f_notes','Shot notes'],['f_script','Script lines linked to the shot'],['lightKey','Light key (numbered fixture table)'],['powerBlock','Power summary'],['legend','Legend']];
  const LAY=[['grid','Grid'],['beams','Light beams'],['dims','Wall sizes'],['ghost','Other shots’ cameras (faded)'],['blocking','Actors, marks & actor moves'],['grip','Grip'],['power','Power & cable runs']];
  const draw=()=>{const X=xo();const chk=([k,l],cls)=>`<label class="chk ${cls||''}"><input type="checkbox" data-xk="${k}" ${X[k]?'checked':''}> ${l}</label>`;const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-xs="${k}" data-v="${v}" class="${String(X[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
    openModal(`<h3>Export shot sheets</h3><div class="xGrid"><div class="xOpts ${X.layout==='diagram'?'dis':''}">
      <div class="xSec">What to export</div>${seg('scope',[['shot','This shot'],['setup','This setup'],['scene','This scene'],...((P.days||[]).length?[['day','Shooting day']]:[]),['project','Whole project'],['pick','Choose…']])}
      ${X.scope==='day'?`<select class="in" data-xsel="dayId" style="margin-top:6px"><option value="">Pick a day…</option>${(P.days||[]).map(d=>`<option value="${d.id}" ${X.dayId===d.id?'selected':''}>${esc(dayLabel(d))} — ${shotsOnDay(d.id).length} shots</option>`).join('')}</select>`:''}${(P.days||[]).length?'':'<div class="pSub" style="margin-top:4px">Add shooting days (Breakdown ▸ Days) to export by day.</div>'}
      ${X.scope==='pick'?pickList(X):''}
      <div class="xSec">Format</div>${seg('format',[['pdf','PDF'],['png','PNG'],['svg','SVG (vector)']])}${X.format!=='svg'?seg('scale',[[1,'Small'],[1.5,'Standard'],[2,'High-res']]):''}
      ${X.format==='pdf'&&X.scope!=='shot'?`<div class="xSec">PDF pages</div>${seg('order',[['shoot','Shooting order'],['script','Script order']])}<div class="pSub" style="margin:2px 0 6px">${X.order==='script'?'Shots follow the script. Setup pages sit at the start of each scene.':'Shots are grouped by setup, the way you’ll shoot them.'}</div>
        ${chk(['contents','Contents page with the shot list (each row links to its page)'])}${chk(['setupPages','Setup page before each setup: every camera, lights, power, gear'])}${chk(['overview','Overview pages: shot thumbnails'])}${X.overview?seg('ovN',[[4,'4 per page'],[6,'6 per page']]):''}`:''}
      ${X.format!=='pdf'&&X.scope!=='shot'?`<div class="pSub" style="margin-top:6px">Saves one ${X.format.toUpperCase()} per shot. Choose PDF for a single file with a contents page.</div>`:''}
      
      
      <div class="xSec">Credits on every page</div><div class="xCred">${CREDIT_ROLES.map(([k,l])=>`<label class="pSub" style="margin:0">${l}<input class="in" data-xcred="${k}" value="${esc((P.credits||{})[k]||'')}" placeholder="Name"></label>`).join('')}</div><div class="xSec">Sheet layout</div>${seg('layout',[['sheet','Diagram + info'],['diagram','Diagram only']])}${seg('theme',[['paper','White (print)'],['dark','Dark']])}<div class="pSub" style="margin:6px 0 2px">Text size beside the diagram</div>${seg('sideText',[['std','Standard'],['lg','Large'],['xl','Extra large']])}
      <div class="xSec">On the diagram</div>${LAY.map(x=>chk(x)).join('')}<div style="height:6px"></div>${seg('labels',[['auto','Auto'],['full','Full'],['min','Numbers only']])+`<div class="pSub" style="margin-top:4px">Auto keeps every label it can place clearly and shows just the number for the few it can’t. Their details are in the light key.</div>`}
      <div class="xSec">Info fields <button class="addMini" data-xall="1" style="margin-left:6px">all</button> <button class="addMini" data-xall="0">none</button></div>${chk(INFO[0])}${INFO.slice(1).map(x=>chk(x,'infoF')).join('')}
      </div><div class="xPrev"><img id="xImg" alt="Preview of the exported sheet"><div class="pSub" style="margin-top:6px">${X.format==='pdf'?(()=>{const pl=exportPlan(X);return `This PDF: <b>${pl.pages.length} page${pl.pages.length===1?'':'s'}</b> · ${pl.rows.length} shot${pl.rows.length===1?'':'s'}${pl.pages.some(p=>p.kind==='setup')?` · ${pl.pages.filter(p=>p.kind==='setup').length} setup page${pl.pages.filter(p=>p.kind==='setup').length===1?'':'s'}`:''}. `;})():''}Preview of shot ${esc(shot().num)}. Your choices are remembered for this project.</div></div></div>
      <div class="mFoot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="xGo">${X.format==='pdf'?'Export PDF':X.scope==='shot'?'Export '+X.format.toUpperCase():'Export '+exportRows(X).length+' '+X.format.toUpperCase()+'s'}</button></div>`,'wide');
    $('#xImg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(buildSheet(scene(),setup(),shot(),X));
    const mb=$('#modalBox');const keep=()=>{const o=mb.querySelector('.xOpts');return o?o.scrollTop:0;};const set=(k,v)=>{const st=keep();P.exportOpts=Object.assign(xo(),{[k]:v});scheduleSave();draw();const o=$('#modalBox .xOpts');if(o)o.scrollTop=st;};
    mb.onchange=e=>{if(e.target.dataset.xcred){P.credits=P.credits||{};P.credits[e.target.dataset.xcred]=e.target.value.trim();changed(false);openExport();return;}if(e.target.dataset.xsel){set(e.target.dataset.xsel,e.target.value);return;}const pk=e.target.dataset.pk;if(pk){const X2=xo();let cur=X2.pick||scene().setups.flatMap(su=>su.shots.map(s=>s.id));const ids=pk.split(',');cur=e.target.checked?[...new Set(cur.concat(ids))]:cur.filter(i=>!ids.includes(i));set('pick',cur);return;}const k=e.target.dataset.xk;if(k)set(k,e.target.checked);};
    mb.onclick=e=>{const b=e.target.closest('[data-xs]');if(b){const k=b.dataset.xs;if(k==='scope'&&b.dataset.v!=='shot'&&xo().format==='png')P.exportOpts=Object.assign(xo(),{format:'pdf'});set(k,k==='scale'||k==='ovN'?+b.dataset.v:b.dataset.v);return;}
      const a=e.target.closest('[data-xall]');if(a){const st=keep();const on=a.dataset.xall==='1';const X2=xo();INFO.slice(1).forEach(([k])=>X2[k]=on);P.exportOpts=X2;scheduleSave();draw();const o=$('#modalBox .xOpts');if(o)o.scrollTop=st;return;}
      if(e.target.id==='xGo'){closeModal();runExport();}};};
  draw();}
$('#bExport').onclick=e=>{e.stopPropagation();$('#exportMenu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('.menuWrap'))$('#exportMenu').classList.remove('open');});
$('#exportMenu').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;$('#exportMenu').classList.remove('open');const x=b.dataset.x;
  if(x==='sheet')openExport();
  else if(x==='shotlist')openShotList();
  else if(x==='sdimport')openSDImport();
  else if(x==='shotcsv')saveFile(`shot-list-${slug(P.title)}.csv`,shotRowsCSV());
  else if(x==='gearcsv')saveFile(`gear-${slug(P.title)}.csv`,gearCSV('project'));
  else if(x==='json')saveFile(`${slug(P.title)}.lightplot.json`,JSON.stringify(P,null,1));
  else if(x==='import')$('#fileIn').click();
  else if(x==='projects')$('#bProjects').click();
  else if(x==='help')$('#bHelp').click();});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const txt=await f.text();const p=JSON.parse(txt);if(!p.scenes)throw 0;if(dirty)await doSave();P=normalize(p);P.title=(P.title||'Imported')+'';projId='p'+rid();V.sceneId=V.setupId=V.shotId=null;V.sel=null;V.multi=[];fixView();undoStack=[];redoStack=[];changed();setTimeout(fit,30);toast('Imported as a new project');}catch(err){toast('That file is not a shot plot project');}e.target.value='';});

/* ============================================================
   Init
   ============================================================ */
window.addEventListener('resize',resize);
renderTools();renderLib();updHint();
boot().then(()=>{resize();fit();});
resize();
</script>

#brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.cf{font:italic 400 18px/1 'EB Garamond',Garamond,Georgia,serif;color:#f3e9d7}
#brand span{font:600 9.5px var(--sans,system-ui,sans-serif);letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
#brand svg{flex:none}
#projTitle{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-weight:600;font-size:14px;min-width:220px}
#projTitle:hover,#projTitle:focus{border-color:var(--line2);outline:none;background:var(--panel2)}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4a5059;background:#23272c}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
.btn.pri:hover{background:#d4651a}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2);border-color:var(--line2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
#saveStat{font:11px var(--mono);color:var(--sub);display:flex;align-items:center;gap:6px}
#saveStat i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
#saveStat.ok i{background:var(--green)} #saveStat.busy i{background:var(--amber)} #saveStat.warn i{background:var(--red)}
.menuWrap{position:relative}

function nextShotNum(sc){const used=new Set();sc.setups.forEach(su=>su.shots.forEach(s=>used.add(s.num)));for(let i=0;i<26;i++){const n=sc.num+String.fromCharCode(65+i);if(!used.has(n))return n;}return sc.num+'-'+(used.size+1);}
function treeClick(e){
  const t=e.target;
  const sR=t.closest('[data-scene]');if(sR){V.sceneId=sR.dataset.scene;V.setupId=null;V.shotId=null;fixView();V.sel=null;changed(true,true);setTimeout(fit,0);return;}
  const suR=t.closest('[data-setup]');if(suR){V.setupId=suR.dataset.setup;V.shotId=null;fixView();V.sel=null;changed(true,true);return;}
  const shR=t.closest('[data-shot]');if(shR){V.setupId=shR.dataset.su;V.shotId=shR.dataset.shot;fixView();if(V.sel&&!findItem(V.sel))V.sel=null;changed(true,true);return;}
  const aS=t.closest('[data-addshot]');if(aS){snap();const su=scene().setups.find(s=>s.id===aS.dataset.addshot);const base=(su.id===setup().id?shot():su.shots[su.shots.length-1]);const n=mkShot(nextShotNum(scene()));n.size=base.size;n.items=reId(clone(base.items));su.shots.push(n);V.setupId=su.id;V.shotId=n.id;V.sel=null;V.rightTab='shot';changed();toast(`Shot ${n.num} added — camera copied from ${base.num}`);return;}
  const aU=t.closest('[data-addsetup]');if(aU){snap();const sc=scene();const cur=setup();const letter=String.fromCharCode(65+sc.setups.length);const su=mkSetup('Setup '+letter);
    su.items=clone(cur.items.filter(i=>(i.t==='line'&&i.kind==='wall')||(LIB[i.t]&&['set','talent','text','power'].includes(LIB[i.t].kind))));reId(su.items);
    su.shots.push(mkShot(nextShotNum(sc)));sc.setups.push(su);V.setupId=su.id;V.shotId=su.shots[0].id;V.sel=null;V.rightTab='shot';changed();toast(`${su.name} added — set, actors & power copied; lights cleared`);return;}
}

function powerFor(items){
  const loads=items.filter(i=>drawsPower(i)>0);const total=loads.reduce((s,i)=>s+drawsPower(i),0);
  const byC={};loads.forEach(i=>{const c=i.circuit||'(unassigned)';(byC[c]=byC[c]||{w:0,items:[]});byC[c].w+=drawsPower(i);byC[c].items.push(i);});
  const gens=items.filter(i=>i.t==='gen');const genCap=gens.reduce((s,g)=>s+(+g.capacity||0),0);
  const outlets={};items.filter(i=>i.t==='outlet').forEach(o=>outlets[o.circuit]=+o.amps||20);
  return {loads,total,byC,gens,genCap,outlets};}
function panelPower(){
  const S=P.settings;const pw=powerFor(activeItems());const cont=S.volts*S.breaker*.8;const amps=pw.total/S.volts;
  const need=pw.total?Math.ceil(pw.total/cont):0;const nums=lightNumbers(activeItems());

  else if(need<=1)rec=`This fits on <b>one ${S.breaker}A household circuit</b> (about ${fmtW(cont)} continuous at 80% of the breaker).`;
  else if(need<=3){cls='';rec=`You need <b>${need} separate ${S.breaker}A circuits</b>. On the scout, map which outlets share a breaker, because outlets in one room are often on the same circuit. Click <b>Auto-assign</b> below to spread the fixtures out.`;}
  else if(pw.total<=9000){cls='';rec=`At <b>${fmtW(pw.total)}</b> you need ${need} house circuits. That's a lot to find in most homes, so think about a <b>putt-putt generator</b> (a 7,000W-class inverter gives about 5,500W running), splitting the load between generator and house, or LED swaps.`;}
  else{cls='bad';rec=`<b>${fmtW(pw.total)}</b> is beyond house power and small generators. Plan a <b>tow plant</b> or a tie-in done by a licensed electrician, and talk to your gaffer and the school's equipment/safety office.`;}
  const circRows=Object.entries(pw.byC).sort().map(([c,v])=>{const lim=(pw.outlets[c]||S.breaker)*S.volts*.8;const pct=v.w/lim*100;const un=c==='(unassigned)';
    return `<tr><td><b>${esc(c)}</b><div class="bar"><i class="${pct>100?'over':pct>80?'hi':''}" style="width:${Math.min(100,pct)}%"></i></div></td><td class="n">${fmtW(v.w)}</td><td class="n">${(v.w/S.volts).toFixed(1)}A</td><td class="n" style="color:${un?'var(--sub)':pct>100?'var(--red)':pct>80?'var(--amber)':'var(--green)'}">${un?'—':Math.round(pct)+'%'}</td></tr>`;}).join('');
  // scene peak
  const sc=scene();let peak={w:0,num:''};sc.setups.forEach(su=>su.shots.forEach(sh=>{const w=powerFor(activeItems(su,sh)).total;if(w>peak.w)peak={w,num:sh.num};}));
  return `<div class="pTitle">Power — Shot ${esc(shot().num)}</div><div class="pSub">Counts every powered fixture that is switched on in this shot, at its full rated draw (the worst case).</div>
  <div class="stat3"><div><small>Total draw</small><div class="big">${fmtW(pw.total)}</div></div><div><small>Amps @${S.volts}V</small><div class="big">${amps.toFixed(1)}</div></div><div><small>${S.breaker}A circuits</small><div class="big">${need}</div></div></div>
  <div class="note ${cls}">${rec}</div>
  <div class="f2">${fld('Voltage',`<select class="in" data-o="settings" data-k="volts">${[120,230,240].map(v=>`<option ${v==S.volts?'selected':''}>${v}</option>`).join('')}</select>`)}${fld('House breaker',`<select class="in" data-o="settings" data-k="breaker">${[15,20].map(v=>`<option ${v==S.breaker?'selected':''} value="${v}">${v}A</option>`).join('')}</select>`)}</div>
  <div class="grp"><h4>By circuit</h4>${circRows?`<table class="t"><tr><th>Circuit</th><th style="text-align:right">Load</th><th style="text-align:right">Amps</th><th style="text-align:right">Used</th></tr>${circRows}</table>`:'<div class="empty">No loads.</div>'}
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" data-act="autocirc">Auto-assign circuits</button><button class="btn sm" data-act="clearcirc">Clear assignments</button></div>

  ${(()=>{const b=activeItems().filter(i=>LIB[i.t]&&LIB[i.t].kind==='light'&&i.on!==false&&i.power==='Battery');return b.length?`<div class="note ok">🔋 <b>${b.length} on battery</b>, not counted on circuits: ${b.map(i=>esc(i.label||LIB[i.t].name)).join(', ')}. Charge them the night before. The Dash lights run about 3 hours at full output.</div>`:'';})()}<div class="grp"><h4>Loads</h4><table class="t"><tr><th>#</th><th>Fixture</th><th>Circuit</th><th style="text-align:right">W</th><th style="text-align:right">A</th></tr>${pw.loads.map(l=>`<tr data-pick="${l.id}" style="cursor:pointer"><td class="n">${nums[l.id]||'—'}</td><td>${esc(l.label||LIB[l.t].name)}</td><td>${esc(l.circuit||'—')}</td><td class="n">${fmtW(drawsPower(l))}</td><td class="n">${(drawsPower(l)/S.volts).toFixed(1)}</td></tr>`).join('')}</table></div>

  <div class="pSub" style="margin-top:8px">Rules of thumb: amps = watts ÷ volts. Load a breaker to no more than 80% for continuous use. LED and HMI figures are the fixture's rated draw; real draw at lower dimmer levels is less. Your gaffer has the final say on distribution.</div></div>`;
}
function autoCircuits(){const S=P.settings;const cont=S.volts*S.breaker*.8;const loads=activeItems().filter(i=>drawsPower(i)>0&&i.t!=='gen').sort((a,b)=>drawsPower(b)-drawsPower(a));
  if(!loads.length)return;snap();const bins=[];loads.forEach(l=>{const w=drawsPower(l);let b=bins.find(b=>b.w+w<=cont);if(!b){b={w:0,name:'C'+(bins.length+1)};bins.push(b);}b.w+=w;l.circuit=b.name;});changed();toast(`Spread across ${bins.length} circuit${bins.length>1?'s':''}`);}
/* gear */
function gearForItems(items,map,shotKey){
  const add=(cat,name,q,why)=>{const k=cat+'|'+name;if(map[k]&&map[k].why!==(why||''))map[k].why='';map[k]=map[k]||{cat,name,q:0,why:why||''};map[k].cur=(map[k].cur||0)+q;};
  items.forEach(it=>{
    if(it.t==='line'){const l=lineLen(it.pts);if(it.kind==='cable')add('Power & distro','Stinger 25′ (12/3)',Math.ceil(l/25),'from drawn cable runs');if(it.kind==='track')add('Camera support','Dolly track — 8′ straight',Math.ceil(l/8),'from drawn track');return;}
    const L=LIB[it.t];if(!L)return;

      if(it.gel&&it.gel!=='None')add('Electric — gels & diffusion',it.gel==='Color gel (custom)'?'Color gel (custom)':it.gel+' gel',1);

      if(st){add('Grip — stands (for fixtures)',st[0],1,'from fixture mounts');if(st[1])add('Grip — stands (for fixtures)','Sandbag',st[1],'est.');}
      if(drawsPower(it)>0)add('Power & distro','Stinger 25′ per fixture',1,'est. 1 per powered fixture');else if(it.power==='Battery')add('Electric — batteries','Charged batteries for '+L.name.replace(/ \(.*\)/,''),1,'battery-powered');
      return;}

      if(it.t==='vflat'){add('Grip',`V-flat (${it.side})`,1);return;}
      const sb={cstand:1,combo:2,rolling:1,menace:3}[it.t];add(sb?'Grip — stands (for grip)':'Grip',L.name,1);if(sb)add('Grip — stands (for grip)','Sandbag',sb,'est.');return;}
    if(L.kind==='camera'){add('Camera',`${it.cam} Camera`,1);{const l=lensOf(it);add('Camera — lenses',l.id==='custom'?`${it.lens}mm lens`:l.name,1);if(l.mount==='F')add('Camera — lenses','Nikon F → Sony E lens adapter',1,'for ZF primes');}const sp={'Baby legs (100mm)':'100mm baby legs','Sticks (tripod)':'Sticks + head','Steadicam':'Steadicam','Gimbal':'Gimbal','Hi-hat':'Hi-hat','Car mount':'Car mount kit','Shoulder':'Shoulder rig'}[it.support];if(sp)add('Camera support',sp,1);return;}
    if(L.kind==='camgear'){if(it.t==='boom')add('Sound','Boom pole + mic',1);else if(it.t==='village')add('Camera','Director’s monitor / village',1);else add('Camera support',L.name,1);return;}

function gearList(scope){const map={};const sc=scene();

  else if(act==='delsetup')confirmBox(`Delete ${setup().name}?`,'Its lights, grip, set pieces and all of its shots go with it. You can undo this.',()=>{const sc=scene();if(sc.setups.length===1){toast('A scene needs at least one setup.');return;}snap();sc.setups=sc.setups.filter(s=>s.id!==setup().id);V.setupId=null;V.shotId=null;fixView();V.sel=null;changed();});

function delSel(){const ids=selIds();if(!ids.length)return;snap();ids.forEach(id=>{const f=findItem(id);if(f)f.arr.splice(f.i,1);});V.sel=null;V.multi=[];changed();}
function dupSel(){const ids=selIds();if(!ids.length)return;snap();const copies=[];ids.forEach(id=>{const f=findItem(id);if(!f)return;const n=clone(f.it);if(n.t==='line')n.pts=n.pts.map(q=>({x:q.x+1,y:q.y+1}));else{n.x+=1;n.y+=1;}f.arr.push(n);copies.push(n);});reId(copies);copies.forEach(n=>{if(n.owner&&!copies.some(c=>c.id===n.owner))n.owner='';});V.sel=copies.length?copies[copies.length-1].id:null;V.multi=copies.length>1?copies.map(c=>c.id):[];changed();}

function nudgeSel(dx,dy){const ids=selIds();if(!ids.length)return;snap();const all=activeItems();const set=new Set(ids);
  ids.forEach(id=>{const it=findItem(id).it;if(it.t==='line'&&it.owner&&findItem(it.owner))set.add(it.owner);});
  const walls=[];set.forEach(id=>{const f=findItem(id);if(!f)return;const it=f.it;if(it.t==='line'){if(it.kind==='wall')walls.push(it);}});
  const caps=capOpenings(walls).filter(c=>!set.has(c.id));
  set.forEach(id=>{const f=findItem(id);if(!f)return;const it=f.it;if(it.t==='line'){it.pts.forEach(q=>{q.x=r2(q.x+dx);q.y=r2(q.y+dy);});}else{it.x=r2(it.x+dx);it.y=r2(it.y+dy);}});
  all.forEach(l=>{if(l.t==='line'&&l.owner&&set.has(l.owner)){const ow=findItem(l.owner);if(ow&&l.pts.length)l.pts[0]={x:ow.it.x,y:ow.it.y};}});
  reseatOpenings(caps);changed();}
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const mod=e.metaKey||e.ctrlKey;const key=e.key.length===1?e.key.toLowerCase():e.key;
  if(mod&&key==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'&&!typing){e.preventDefault();redo();return;}
  if(typing){if(e.key==='Escape')document.activeElement.blur();return;}
  if($('#modal').classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  if(mod&&key==='d'){e.preventDefault();dupSel();return;}
  if(mod&&key==='a'){e.preventDefault();const ids=activeItems().map(i=>i.id);V.sel=ids.length?ids[ids.length-1]:null;V.multi=ids.length>1?ids:[];renderPanel();renderCanvas();return;}
  if(mod)return;
  if(V.draft){
    if(/^[0-9.'"]$/.test(e.key)||(e.key===' '&&V.typed)){V.typed+=e.key;e.preventDefault();updHint();return;}
    if(e.key==='Backspace'){e.preventDefault();if(V.typed){V.typed=V.typed.slice(0,-1);updHint();}else if(V.draft.pts.length>1){V.draft.pts.pop();renderCanvas();}return;}
    if(e.key==='Enter'){e.preventDefault();if(V.typed.trim())applyTyped();else finishDraft();return;}
  }
  if(e.key===' '){spaceDown=true;cv.classList.add('pan');e.preventDefault();return;}
  if(e.key==='Escape'){V.placing=null;V.ghostPos=null;V.multi=[];$('#exportMenu').classList.remove('open');setTool('select');return;}
  if((e.key==='Delete'||e.key==='Backspace')&&V.sel){e.preventDefault();delSel();return;}
  const it=selItem();
  if(it&&e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?1:.25;nudgeSel(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0);return;}
  if(it&&key==='r'&&it.t!=='line'){snap();it.r=((it.r||0)+(e.shiftKey?-15:15)+540)%360-180;V.lastRot[it.t]=it.r;changed();return;}
  if(it&&key==='o'&&LIB[it.t]&&LIB[it.t].kind==='light'){snap();it.on=it.on===false;changed();return;}
  const map={v:'select',h:'pan',b:'room',w:'wall',m:'actor',c:'cammove',t:'track',e:'cable'};
  if(map[key]){V.placing=null;setTool(map[key]);return;}
  if(key==='d'){V.dims=!V.dims;saveUI();renderTools();renderCanvas();return;}
  if(e.key==='['){$('#bLeft').click();return;}
  if(e.key===']'){$('#bRight').click();return;}
  if(e.key==='\\'){const any=UI.L||UI.R;UI.L=!any&&!UI.narrow;UI.R=false;if(!any&&UI.narrow)UI.L=true;applyUI();return;}
  if(key==='f'){fit();return;}
  if(e.key==='='||e.key==='+'){setZoom(V.zoom*1.2);return;}
  if(e.key==='-'){setZoom(V.zoom/1.2);return;}
});

function scheduleSave(){dirty=true;P.updated=Date.now();setStat('busy','Unsaved changes…');clearTimeout(saveTimer);saveTimer=setTimeout(doSave,1200);}
async function doSave(){

  saving=true;dirty=false;const json=JSON.stringify(P);
  const all=lsGet('lplot.projects')||{};all[projId]={title:P.title,updated:P.updated,json};const localOK=lsSet('lplot.projects',all);lsSet('lplot.last',projId);

async function listProjects(){const out={};const loc=lsGet('lplot.projects')||{};Object.entries(loc).forEach(([id,v])=>out[id]={id,title:v.title,updated:v.updated,json:v.json,where:'browser'});

async function boot(){
  // local first, instantly
  const last=lsGet('lplot.last');const loc=lsGet('lplot.projects')||{};
  if(last&&loc[last])loadProject(last,loc[last].json);else newProject(true);
  if(!(window.claude&&window.claude.use)){setStat('ok',Object.keys(loc).length?'Saved in this browser':'Saved in this browser');return;}
  try{
    const [u,d,dl]=await Promise.all([window.claude.use('user'),window.claude.use('db'),window.claude.use('downloads')]);
    downloadsNS=dl||null;
    if(u&&d){const id=await u.id();if(id){DB=d;UID=id;setStat('busy','Syncing…');const list=await listProjects();

      rows.forEach(([k,v])=>{const ls=wrapText(v,58);t+=txt(RX+10,y,k,{size:12,c:T.sub});ls.slice(0,3).forEach(l=>{t+=txt(RX+130,y,l,{size:12.5,w:600});y+=18;});y+=2;});
      if(X.f_desc)para('Description',sh.desc,3);if(X.f_blocking)para('Blocking',sh.blocking,5);if(X.f_intent)para('Lighting intent',su.notes,4);if(X.f_notes)para('Notes',sh.notes,3);y+=6;}
    if(X.f_script){const ct=coverText(sh);if(ct&&sec('Script — lines this shot covers')){para('Sides',ct,14,true);y+=6;}}
    if(X.lightKey&&sec('Light key')){
      const lights=items.filter(i=>LIB[i.t]&&LIB[i.t].kind==='light');
      t+=txt(RX+10,y,'#',{size:10.5,w:700,c:T.sub})+txt(RX+36,y,'FIXTURE',{size:10.5,w:700,c:T.sub})+txt(RX+230,y,'ROLE',{size:10.5,w:700,c:T.sub})+txt(RX+335,y,'COLOR / MOD',{size:10.5,w:700,c:T.sub})+txt(RX+RW-10,y,'W · CKT',{size:10.5,w:700,c:T.sub,anchor:'end'});y+=20;
      let shown=0;lights.forEach(l=>{if(!room(X.powerBlock?150:24))return;shown++;const L=LIB[l.t];const on=l.on!==false;t+=`<circle cx="${RX+18}" cy="${y-4}" r="9" fill="${on?C.badge:T.off}"/>`+txt(RX+18,y,nums[l.id],{size:11,w:700,c:C.badgeText,anchor:'middle',mono:1});
        const nm=(l.label?l.label+' — ':'')+L.name.replace(/ \(.*\)/,'');t+=txt(RX+36,y,nm.length>30?nm.slice(0,29)+'…':nm,{size:11.5,w:600,c:on?T.ink:T.off})+txt(RX+230,y,(l.role||'').slice(0,15)+(on?'':' (off)'),{size:11.5,c:on?T.ink:T.off});
        const cm=[GELS[l.gel]==='c'?'color gel':(effKelvin(l)+'K'),l.gel!=='None'&&GELS[l.gel]!=='c'?l.gel:'',l.modifier!=='None'?l.modifier:'',l.intensity<100?l.intensity+'%':''].filter(Boolean).join(' · ');
        t+=`<rect x="${RX+335}" y="${y-11}" width="10" height="10" fill="${hex(lightRGB(l))}" stroke="${T.off}" stroke-width=".5"/>`+txt(RX+350,y,cm.length>19?cm.slice(0,18)+'…':cm,{size:10.5});
        t+=txt(RX+RW-10,y,`${l.watts?fmtW(+l.watts):'—'}${l.circuit?' · '+l.circuit:''}`,{size:11,anchor:'end',mono:1});y+=21;});
      if(lights.length>shown){t+=txt(RX+36,y,`+ ${lights.length-shown} more…`,{size:11,c:T.sub});y+=20;}
      if(!lights.length){t+=txt(RX+10,y,'No fixtures placed.',{size:12,c:T.sub});y+=20;}y+=8;}
    if(X.powerBlock&&sec('Power')){
      t+=txt(RX+10,y+10,fmtW(pw.total),{size:24,w:700,mono:1})+txt(RX+170,y+10,(pw.total/S.volts).toFixed(1)+' A',{size:24,w:700,mono:1})+txt(RX+330,y+10,`${pw.total?Math.ceil(pw.total/cont):0} × ${S.breaker}A`,{size:24,w:700,mono:1});y+=28;
      t+=txt(RX+10,y,'total draw',{size:10.5,c:T.sub})+txt(RX+170,y,`@ ${S.volts}V`,{size:10.5,c:T.sub})+txt(RX+330,y,'circuits at 80%',{size:10.5,c:T.sub});y+=24;
      Object.entries(pw.byC).sort().slice(0,6).forEach(([c,v])=>{if(!room(4))return;const lim=(pw.outlets[c]||S.breaker)*S.volts*.8;const pct=Math.min(1,v.w/lim);t+=txt(RX+10,y,c.slice(0,16),{size:11.5,w:600})+`<rect x="${RX+130}" y="${y-10}" width="220" height="10" fill="${T.track}"/><rect x="${RX+130}" y="${y-10}" width="${220*pct}" height="10" fill="${v.w>lim?'#dc2626':v.w>lim*.8?'#d97706':'#16a34a'}"/>`+txt(RX+RW-10,y,`${fmtW(v.w)} · ${(v.w/S.volts).toFixed(1)}A`,{size:11,anchor:'end',mono:1});y+=19;});
      if(pw.genCap&&room(4)){t+=txt(RX+10,y,`Generator: ${fmtW(pw.genCap)} running · ${Math.round(pw.total/(pw.genCap*.8)*100)}% of usable`,{size:11.5,c:pw.total>pw.genCap*.8?'#dc2626':T.ink});y+=19;}}
    if(X.legend){t+=txt(RX,Ht-62,'LEGEND',{size:10.5,w:700,c:T.sub});
      const lg=[['#f2a93b','Tungsten'],['#9fc8ff','HMI'],['#9fe8de','LED'],['#d1b8ff','Fluor.'],['#5cb8ff','Camera'],['#f08c3c','Power']];lg.forEach(([c,n],i)=>{t+=`<rect x="${RX+i*82}" y="${Ht-52}" width="12" height="12" fill="${c}"/>`+txt(RX+i*82+17,Ht-42,n,{size:11});});
      t+=txt(RX,Ht-20,'Numbered marks on actor paths = blocking positions in order · dashed blue = camera move',{size:10.5,c:T.sub});}
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${Wd}" height="${Ht}" viewBox="0 0 ${Wd} ${Ht}"><rect width="${Wd}" height="${Ht}" fill="${T.bg}"/><defs><style>${BRANDFF}</style><clipPath id="dclip"><rect x="${DX}" y="${DY}" width="${DW}" height="${DH}"/></clipPath></defs><g clip-path="url(#dclip)"><g transform="translate(${ox} ${oy}) scale(${s}) translate(${-b.x0} ${-b.y0})">${g}</g></g>${head}${frame}${t}</svg>`;
}
function svgToPng(svg,scale){scale=scale||1.5;return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=1650*scale;c.height=1275*scale;const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0,1650,1275);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej('png'),'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);rej('img');};img.src=url;});}
async function exportOne(sc,su,sh,X){const svg=buildSheet(sc,su,sh,X);const name=`${slug(P.title)}_sc${slug(sc.num)}_shot-${slug(sh.num)}`;
  if(X.format==='svg')return saveFile(name+'.svg',svg);
  let png;try{png=await svgToPng(svg,X.scale);}catch(e){toast('PNG render failed — try SVG');return false;}
  for(let tries=0;tries<25;tries++){if(!downloadsNS)return saveFile(name+'.png',png);try{await downloadsNS.save({filename:name+'.png',data:png});return true;}catch(e){if(e&&e.code==='rate_limited'){await new Promise(r=>setTimeout(r,900));continue;}return false;}}return false;}
async function runExport(){const X=xo();const sc=scene();
  if(X.scope==='scene'){let n=0;for(const su of sc.setups)for(const sh of su.shots){if(await exportOne(sc,su,sh,X))n++;else{toast(n?`Stopped after ${n} sheet${n>1?'s':''}`:'Export cancelled');return;}}toast(`${n} sheet${n===1?'':'s'} exported`);}
  else await exportOne(sc,setup(),shot(),X);}
function openExport(){
  const INFO=[['header','Title bar (production, scene, shot #)'],['f_scene','Scene description'],['f_size','Shot size & angle'],['f_move','Movement'],['f_cam','Camera, lens & support'],['f_cast','Cast'],['f_desc','Shot description'],['f_blocking','Blocking notes'],['f_intent','Lighting intent'],['f_notes','Shot notes'],['f_script','Script lines linked to the shot'],['lightKey','Light key (numbered fixture table)'],['powerBlock','Power summary'],['legend','Legend']];
  const LAY=[['grid','Grid'],['beams','Light beams'],['dims','Wall sizes'],['ghost','Other shots’ cameras (faded)'],['blocking','Actors, marks & actor moves'],['grip','Grip'],['power','Power & cable runs']];
  const draw=()=>{const X=xo();const chk=([k,l],cls)=>`<label class="chk ${cls||''}"><input type="checkbox" data-xk="${k}" ${X[k]?'checked':''}> ${l}</label>`;const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-xs="${k}" data-v="${v}" class="${String(X[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
    openModal(`<h3>Export shot sheet</h3><div class="xGrid"><div class="xOpts ${X.layout==='diagram'?'dis':''}">
      <div class="xSec">Layout</div>${seg('layout',[['sheet','Diagram + info'],['diagram','Diagram only']])}${seg('theme',[['paper','White (print)'],['dark','Dark']])}
      <div class="xSec">On the diagram</div>${LAY.map(x=>chk(x)).join('')}<div style="height:6px"></div>${seg('labels',[['full','Full labels'],['min','Numbers only']])}
      <div class="xSec">Info fields <button class="addMini" data-xall="1" style="margin-left:6px">all</button> <button class="addMini" data-xall="0">none</button></div>${chk(INFO[0])}${INFO.slice(1).map(x=>chk(x,'infoF')).join('')}
      <div class="xSec">Output</div>${seg('scope',[['shot','This shot'],['scene','Every shot in scene']])}${seg('format',[['png','PNG'],['svg','SVG (vector)']])}${X.format==='png'?seg('scale',[[1,'Small'],[1.5,'Standard'],[2,'High-res']]):''}
      </div><div class="xPrev"><img id="xImg" alt="Preview of the exported sheet"><div class="pSub" style="margin-top:6px">Preview of shot ${esc(shot().num)}. Your choices are remembered for this project.</div></div></div>
      <div class="mFoot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="xGo">${X.scope==='scene'?'Export every shot':'Export '+X.format.toUpperCase()}</button></div>`,'wide');
    $('#xImg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(buildSheet(scene(),setup(),shot(),X));
    const mb=$('#modalBox');const keep=()=>{const o=mb.querySelector('.xOpts');return o?o.scrollTop:0;};const set=(k,v)=>{const st=keep();P.exportOpts=Object.assign(xo(),{[k]:v});scheduleSave();draw();const o=$('#modalBox .xOpts');if(o)o.scrollTop=st;};
    mb.onchange=e=>{const k=e.target.dataset.xk;if(k)set(k,e.target.checked);};
    mb.onclick=e=>{const b=e.target.closest('[data-xs]');if(b){const k=b.dataset.xs;set(k,k==='scale'?+b.dataset.v:b.dataset.v);return;}
      const a=e.target.closest('[data-xall]');if(a){const st=keep();const on=a.dataset.xall==='1';const X2=xo();INFO.slice(1).forEach(([k])=>X2[k]=on);P.exportOpts=X2;scheduleSave();draw();const o=$('#modalBox .xOpts');if(o)o.scrollTop=st;return;}
      if(e.target.id==='xGo'){closeModal();runExport();}};};
  draw();}
$('#bExport').onclick=e=>{e.stopPropagation();$('#exportMenu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('.menuWrap'))$('#exportMenu').classList.remove('open');});
$('#exportMenu').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;$('#exportMenu').classList.remove('open');const x=b.dataset.x;
  if(x==='sheet')openExport();
  else if(x==='shotlist')openShotList();
  else if(x==='sdimport')openSDImport();
  else if(x==='shotcsv')saveFile(`shot-list-${slug(P.title)}.csv`,shotRowsCSV());
  else if(x==='gearcsv')saveFile(`gear-${slug(P.title)}.csv`,gearCSV('project'));
  else if(x==='json')saveFile(`${slug(P.title)}.lightplot.json`,JSON.stringify(P,null,1));
  else if(x==='import')$('#fileIn').click();
  else if(x==='projects')$('#bProjects').click();
  else if(x==='help')$('#bHelp').click();});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const txt=await f.text();const p=JSON.parse(txt);if(!p.scenes)throw 0;if(dirty)await doSave();P=normalize(p);P.title=(P.title||'Imported')+'';projId='p'+rid();V.sceneId=V.setupId=V.shotId=null;V.sel=null;V.multi=[];fixView();undoStack=[];redoStack=[];changed();setTimeout(fit,30);toast('Imported as a new project');}catch(err){toast('That file is not a lighting plot project');}e.target.value='';});

/* ============================================================
   Init
   ============================================================ */
window.addEventListener('resize',resize);
renderTools();renderLib();updHint();
boot().then(()=>{resize();fit();});
resize();
</script>
